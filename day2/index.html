<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="calculator">
        <div class="outer">
            <div class="inner">
                <div id="screen" class="screen">
                    <div class="btn-row">
                        <button class="green" disabled>MC</button>
                        <button class="green" disabled>MR</button>
                        <button class="green" disabled>M+</button>
                        <button class="green" disabled>M-</button>
                        <button class="red" onclick="ceClick('c')">CE</button>
                    </div>
                    <div class="btn-row">
                        <button class="blue" onclick="numberClick(7)">7</button>
                        <button class="blue" onclick="numberClick(8)">8</button>
                        <button class="blue" onclick="numberClick(9)">9</button>
                        <button class="green" disabled>&divide;</button>
                        <button class="green" onclick="numberClick('Sqrt')">√</button>
                    </div>
                    <div class="btn-row">
                        <button class="blue" onclick="numberClick(4)">4</button>
                        <button class="blue" onclick="numberClick(5)">5</button>
                        <button class="blue" onclick="numberClick(6)">6</button>
                        <button class="green" disabled>&times;</button>
                        <button class="green" disabled>%</button>
                    </div>
                    <div class="btn-row">
                        <button class="blue" onclick="numberClick(1)">1</button>
                        <button class="blue" onclick="numberClick(2)">2</button>
                        <button class="blue" onclick="numberClick(3)">3</button>
                        <button class="green" onclick="operatorClick('-')">-</button>
                        <button class="green" disabled>1/x</button>
                    </div>
                </div>
                <div class="btn-row">
                        <button class="blue" onclick="numberClick(0)">0</button>
                        <button class="blue" disabled>.</button>
                        <button class="blue" disabled>+/-</button>
                        <button class="green" onclick="operatorClick('+')">+</button>
                        <button class="green" onclick="equalClick('=')">=</button>
                    </div>
                    <div class="student">

                    </div>
            </div>
        </div>
    </div>
</body>
<script src="index.js"></script>
</html>
