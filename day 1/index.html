<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="invoice">

        <!-- Name -->
        <div class="name">
            <p id="name">[name]</p>
        </div>


        <!-- Logo + Invoice Number -->
        <div class="invoice-header">

            <div id="companyLogo">
                <span class="placeholder">[logo-company]</span>
            </div>

            <p id="invoiceNumber">[invoice-number]</p>

        </div>


        <!-- Invoice -->
        <div class="invoice-title">
            <p><b>INVOICE</b></p>
        </div>


        <!-- Date -->
        <div class="date">

            <p>
                <b>Date :</b>
                <span id="date">[date]</span>
            </p>

        </div>


        <!-- Bill To + From -->
        <div class="info-section">

            <!-- Bill To -->
            <div class="info-box">

                <p><b>Bill To :</b></p>

                <p id="billToName">[name]</p>

                <p id="billToAddress">[bill]</p>

                <p id="billToEmail">[gmailbill]</p>

            </div>


            <!-- From -->
            <div class="info-box">

                <p><b>From :</b></p>

                <p id="fromName">[name]</p>

                <p id="fromAddress">[bill]</p>

                <p id="fromEmail">[gmailbill]</p>

            </div>

        </div>


        <!-- Table -->
        <div class="table-container">

            <table>

                <tr class="table-header">

                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Amount</th>

                </tr>


                <tbody id="items">

                    <tr>
                        <td colspan="4" class="placeholder">
                            [items]
                        </td>
                    </tr>

                </tbody>


                <tr class="total">

                    <td></td>
                    <td></td>
                    <td>Total</td>
                    <td id="total">[total]</td>

                </tr>

            </table>

        </div>

        <!-- Payment -->
        <div class="payment">

            <p>
                <b>Payment method :</b>
                <span id="paymentMethod">[payment-method]</span>
            </p>

            <p>
                <b>Note :</b>
                <span id="note">[note]</span>
            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="./data.js"></script>
    <script src="./script.js"></script>

</body>

</html>
