<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="invoice">

    <!-- Company -->
    <div class="top">

        <div>
            <h1 id="companyName"></h1>
            <p id="companyAddress"></p>
        </div>

        <h1 class="invoice-title">INVOICE</h1>

    </div>


    <!-- Customer information -->
    <div class="information">

        <!-- Bill To -->
        <div>
            <h3>Bill To</h3>
            <p id="billToName"></p>
            <p id="billToAddress"></p>
        </div>


        <!-- Ship To -->
        <div>
            <h3>Ship To</h3>
            <p id="shipToName"></p>
            <p id="shipToAddress"></p>
        </div>


        <!-- Invoice information -->
        <div class="invoice-info">

            <div>
                <b>Invoice #</b>
                <span id="invoiceId"></span>
            </div>

            <div>
                <b>Invoice Date</b>
                <span id="invoiceDate"></span>
            </div>

            <div>
                <b>P.O.#</b>
                <span id="poNumber"></span>
            </div>

            <div>
                <b>Due Date</b>
                <span id="dueDate"></span>
            </div>

        </div>

    </div>


    <!-- Items -->
    <table>

        <thead>
            <tr>
                <th>QTY</th>
                <th>DESCRIPTION</th>
                <th>UNIT PRICE</th>
                <th>AMOUNT</th>
            </tr>
        </thead>

        <tbody id="items">
        </tbody>

    </table>


    <!-- Terms -->
    <div class="terms">

        <h3>Terms & Conditions</h3>

        <p id="terms"></p>

    </div>

</div>


<!-- สำคัญ: data.js ต้องมาก่อน script.js -->
<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
